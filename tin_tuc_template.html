<style>
/* Tông xanh lá – trắng: xanh đậm cho dải tiêu đề, xanh cốm làm điểm nhấn */
:root {
  --brand: #00704a; --brand-dark: #004d33; --brand-lime: #8dc63f;
  --bg: #f2f6f4; --card: #ffffff; --text: #1b1f24; --muted: #667080; --line: #dfe7e3;
  --accent: #00704a; --accent-soft: #e2f2e9; --new: #d1242f; --chip: #edf3f0; --chip-text: #23342c;
  --star: #b7791f; --star-soft: #fff6e0;
  --c-dn: #1f6feb; --c-ck: #1a7f37; --c-cg: #8250df; --c-vm: #bf5700; --c-hh: #9a6700; --c-qt: #0a7ea4;
  --up: #1a7f37; --down: #cf222e; --zebra: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #0b5a3c; --brand-dark: #063524; --brand-lime: #9fd45a;
    --bg: #0e1412; --card: #16201c; --text: #e6ece9; --muted: #98a8a0; --line: #26332d;
    --accent: #3fbf7f; --accent-soft: #12301f; --new: #ff7b72; --chip: #1f2b26; --chip-text: #d2ddd7;
    --star: #e3b341; --star-soft: #2e2511;
    --c-dn: #58a6ff; --c-ck: #3fb950; --c-cg: #bc8cff; --c-vm: #f0883e; --c-hh: #d29922; --c-qt: #39c5cf;
    --up: #3fb950; --down: #ff7b72; --zebra: #1c2129;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.banner { background: linear-gradient(115deg, var(--brand-dark), var(--brand) 60%, #0a8a55);
  color: #fff; border-bottom: 4px solid var(--brand-lime); }
.banner .wrap { padding-top: 18px; padding-bottom: 16px; }
.banner .lien-he { font-size: clamp(14px, 3.8vw, 16px); font-weight: 600; margin-top: 4px; }
.banner .cap-nhat { display: block; margin-top: 6px; }
h1 { font-size: clamp(18px, 4.6vw, 24px); margin: 0; line-height: 1.35; }
.banner a.dt { color: var(--brand-lime); text-decoration: none; white-space: nowrap; }
.banner a.dt:hover { text-decoration: underline; }
.cap-nhat { color: var(--muted); font-size: 13px; }
.cap-nhat.cu { color: var(--new); font-weight: 600; }
.banner .cap-nhat { color: #ffffffcc; }
.banner .cap-nhat.cu { color: #ffd2cc; }
.thanh-cong-cu { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.thanh-cong-cu input, .thanh-cong-cu select { font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.thanh-cong-cu input { flex: 1 1 260px; min-width: 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.tab { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
  border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; }
.tab .so { color: var(--muted); font-size: 12px; margin-left: 4px; }
.tab.chon { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab.chon .so { color: #ffffffcc; }
.bo-cuc { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .bo-cuc { grid-template-columns: 1fr; } .ben { order: -1; } }
.the { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.the { border-top: 3px solid var(--accent); }
.the h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.tab-gia { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.tab-gia button { flex: none; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted);
  font: inherit; font-size: 13px; padding: 6px 8px; cursor: pointer; }
.tab-gia button.chon { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
table.gia { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.gia td { padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.gia tr:nth-child(even) td { background: var(--zebra); }
table.gia td.so { text-align: right; white-space: nowrap; }
table.gia .dv { display: block; font-size: 11px; color: var(--muted); }
.tang { color: var(--up); }
.giam { color: var(--down); }
.ghi-chu { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
/* Mục Định giá CTCK */
.dg-the { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--accent);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.dg-the h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.bang-cuon { overflow-x: auto; }
table.dg { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.dg th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: right; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
table.dg td { text-align: right; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.dg th.trai, table.dg td.trai { text-align: left; }
table.dg tr:nth-child(even) td { background: var(--zebra); }
.kn { font-weight: 700; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; color: #fff; background: var(--star); }
.kn.tot { background: var(--up); }
.kn.xau { background: var(--down); }
.gmt { font-weight: 700; color: var(--accent); }
.tin details { margin-top: 4px; font-size: 14px; color: var(--muted); }
.tin details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
@media (max-width: 900px) { .cuon-gia { max-height: 330px; overflow-y: auto; } }
@media (max-width: 520px) { table.gia .bo-doi { display: none; } }
.ma-nong { display: flex; flex-wrap: wrap; gap: 6px; }
.dang-loc { display: none; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
.dang-loc.hien { display: flex; }
.dang-loc button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--accent); cursor: pointer; }
.ngay { font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.ngay:first-child { margin-top: 0; }
.tin { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
  border-left: 4px solid var(--mau, var(--line)); }
.tin.uu { background: var(--star-soft); }
.dong-dau { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.gio { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
.nhan { color: var(--mau); font-weight: 600; }
.moi { background: var(--new); color: #fff; border-radius: 4px; padding: 0 5px; font-weight: 700; font-size: 11px; }
.chip { border: 0; background: var(--chip); color: var(--chip-text); border-radius: 6px; padding: 1px 7px; cursor: pointer;
  font: 600 12px/1.6 ui-monospace, Consolas, monospace; }
.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip.sao { background: var(--star); color: #fff; }
.chip .dem { font-weight: 400; opacity: .7; margin-left: 3px; }
.tin a.td { color: var(--text); text-decoration: none; font-weight: 600; font-size: 15.5px; }
.tin a.td:hover { color: var(--accent); text-decoration: underline; }
.sapo { color: var(--muted); font-size: 14px; margin-top: 3px; }
.nguon { margin-left: auto; }
.trong { text-align: center; color: var(--muted); padding: 40px 0; }
.them { display: block; margin: 12px auto; font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); cursor: pointer; }
</style>

<body>
<header class="banner">
  <div class="wrap">
    <h1>📰 Bản Tin Tự Động - Đạt VCBS</h1>
    <div class="lien-he">- Liên hệ tư vấn - <a class="dt" href="tel:0383526536">0383526536</a></div>
    <div class="cap-nhat" id="capNhat"></div>
  </div>
</header>
<div class="wrap">
  <div class="thanh-cong-cu">
    <input id="timKiem" type="search" placeholder="Tìm mã (HPG) hoặc từ khóa (lãi suất, giá dầu…)">
    <select id="khoangGio">
      <option value="3">3 giờ qua</option>
      <option value="12">12 giờ qua</option>
      <option value="24">24 giờ qua</option>
      <option value="72">3 ngày qua</option>
    </select>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="bo-cuc">
    <main>
      <div class="dang-loc" id="dangLoc"></div>
      <div id="dsTin"></div>
    </main>
    <aside class="ben">
      <section class="the">
        <h2>Bảng giá</h2>
        <div class="tab-gia" id="tabGia"></div>
        <div class="cuon-gia"><table class="gia"><tbody id="bangGia"></tbody></table></div>
        <div class="ghi-chu">Nguồn Yahoo Finance, trễ khoảng 10–15 phút. Thay đổi so với phiên trước.</div>
      </section>
      <section class="the">
        <h2>Mã được nhắc nhiều nhất</h2>
        <div class="ma-nong" id="maNong"></div>
      </section>
    </aside>
  </div>
</div>
<script>
const DATA = /*DU_LIEU*/null;
const MAU = { dn: "var(--c-dn)", ck: "var(--c-ck)", cg: "var(--c-cg)", vm: "var(--c-vm)", hh: "var(--c-hh)", qt: "var(--c-qt)" };
const TEN_NGAN = { dn: "Doanh nghiệp", ck: "Thị trường CK", cg: "Chuyên gia", vm: "Vĩ mô", hh: "Hàng hóa", qt: "Quốc tế" };
const UU = new Set(DATA.uu_tien);
const TRANG = 150;

function boDau(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function luuDoc(k, macDinh) { try { return localStorage.getItem(k) ?? macDinh; } catch (e) { return macDinh; } }
function luuGhi(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// Trạng thái lọc lưu trên URL (#nhom=dn&gio=24&q=HPG) để giữ nguyên khi trang tự làm mới
const tham = new URLSearchParams(location.hash.slice(1));
const st = { nhom: tham.get("nhom") || "tat", gio: +(tham.get("gio") || 24), q: tham.get("q") || "", ma: tham.get("ma") || "", hien: TRANG };
function ghiHash() {
  const p = new URLSearchParams();
  if (st.nhom !== "tat") p.set("nhom", st.nhom);
  if (st.gio !== 24) p.set("gio", st.gio);
  if (st.q) p.set("q", st.q);
  if (st.ma) p.set("ma", st.ma);
  history.replaceState(null, "", "#" + p.toString());
}

// Tin "MỚI": lấy về sau lần cuối bạn mở trang
const lanTruoc = luuDoc("tt_lan_xem", DATA.cap_nhat);
luuGhi("tt_lan_xem", DATA.cap_nhat);

for (const t of DATA.tin) {
  t.d = new Date(t.t);
  t.uu = t.ma.some(m => UU.has(m));
  t.moi = t.lay > lanTruoc;
  t.khoa = boDau(t.td + " " + t.sapo + " " + t.ma.join(" ") + " " + t.nguon);
}

function capNhatDongHo() {
  const phut = Math.round((Date.now() - new Date(DATA.cap_nhat)) / 60000);
  const el = document.getElementById("capNhat");
  const gio = new Date(DATA.cap_nhat).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  el.textContent = `Cập nhật lúc ${gio} (${phut < 1 ? "vừa xong" : phut + " phút trước"}) · tự làm mới mỗi 5 phút`;
  el.classList.toggle("cu", phut > 30);
  if (phut > 30) el.textContent += " · ⚠ Lâu chưa có dữ liệu mới, kiểm tra máy hoặc lịch chạy";
}

function locTheoGioVaTim() {
  const tu = Date.now() - st.gio * 3600e3;
  const q = boDau(st.q.trim());
  return DATA.tin.filter(t => t.d >= tu && (!q || t.khoa.includes(q)) && (!st.ma || t.ma.includes(st.ma)));
}

function veTabs(ds) {
  const dem = { tat: ds.length, uu: ds.filter(t => t.uu).length };
  for (const k in DATA.nhom) dem[k] = ds.filter(t => t.nhom === k).length;
  const tabs = [["tat", "Tất cả"]];
  if (UU.size) tabs.push(["uu", "⭐ Ưu tiên"]);
  tabs.push(["dg", "📊 Định giá CTCK"]);
  dem.dg = locBaoCao().length;
  for (const k in DATA.nhom) tabs.push([k, DATA.nhom[k]]);
  document.getElementById("tabs").innerHTML = tabs.map(([k, ten]) =>
    `<button class="tab ${st.nhom === k ? "chon" : ""}" data-nhom="${k}">${esc(ten)}<span class="so">${dem[k]}</span></button>`).join("");
}

function veMaNong(ds) {
  const dem = {};
  for (const t of ds) for (const m of t.ma) dem[m] = (dem[m] || 0) + 1;
  const top = Object.entries(dem).sort((a, b) => b[1] - a[1]).slice(0, 24);
  document.getElementById("maNong").innerHTML = top.length
    ? top.map(([m, n]) => `<button class="chip ${UU.has(m) ? "sao" : ""}" data-ma="${m}">${m}<span class="dem">${n}</span></button>`).join("")
    : `<span class="cap-nhat">Chưa có</span>`;
}

function nhanNgay(d) {
  const hom = new Date(); hom.setHours(0, 0, 0, 0);
  const ngay = new Date(d); ngay.setHours(0, 0, 0, 0);
  const lech = Math.round((hom - ngay) / 864e5);
  const s = d.toLocaleDateString("vi-VN", { weekday: "long", day: "2-digit", month: "2-digit" });
  return lech === 0 ? "Hôm nay · " + s : lech === 1 ? "Hôm qua · " + s : s;
}

// ---- Mục Định giá CTCK: danh mục khuyến nghị VCBS + báo cáo mới nhất của các CTCK (CafeF tổng hợp) ----
const DG = DATA.dinh_gia || { vcbs: {}, bao_cao: [] };
for (const b of DG.bao_cao) b.khoa = boDau([b.ma, b.ctck, b.td, b.tom_tat, b.kn].join(" "));
let dmVcbs = luuDoc("tt_vcbs", "CPCTC");
const KN_TOT = /^(MUA|KHẢ QUAN|TÍCH LŨY|OUTPERFORM|BUY|ACCUMULATE)$/, KN_XAU = /^(BÁN|KÉM KHẢ QUAN|UNDERPERFORM|SELL)$/;

function locBaoCao() {
  const q = boDau(st.q.trim());
  return DG.bao_cao.filter(b => (!q || b.khoa.includes(q)) && (!st.ma || b.ma === st.ma));
}
function oVcbs(k, v) {
  if (v === null || v === undefined || v === "") return "";
  if (/^ma(ChungKhoan)?$/.test(k)) return `<button class="chip ${UU.has(v) ? "sao" : ""}" data-ma="${esc(v)}">${esc(v)}</button>`;
  if (typeof v === "number") return v.toLocaleString("vi-VN", { maximumFractionDigits: 2 });
  return esc(String(v));
}
function veDinhGia() {
  let html = "";
  const dm = DG.vcbs || {};
  if (!dm[dmVcbs]) dmVcbs = Object.keys(dm)[0];
  if (dmVcbs) {
    const d = dm[dmVcbs];
    const cot = d.cot.filter(([k]) => d.ds.some(r => r[k] !== null && r[k] !== undefined && r[k] !== ""));
    const ngay = d.ngay ? new Date(d.ngay).toLocaleDateString("vi-VN") : "";
    html += `<section class="dg-the"><h2>Danh mục khuyến nghị VCBS</h2>
      <div class="tab-gia">${Object.entries(dm).map(([k, n]) =>
        `<button class="${k === dmVcbs ? "chon" : ""}" data-vcbs="${k}">${esc(n.ten)}</button>`).join("")}</div>
      <div class="bang-cuon"><table class="dg"><thead><tr>${cot.map(([k, ten]) =>
        `<th class="${/^ma|^ngay/.test(k) || k === "ghiChu" ? "trai" : ""}">${esc(ten)}</th>`).join("")}</tr></thead>
      <tbody>${d.ds.map(r => `<tr>${cot.map(([k]) =>
        `<td class="${/^ma|^ngay/.test(k) || k === "ghiChu" ? "trai" : ""}">${oVcbs(k, r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="ghi-chu">Cập nhật ${ngay} · Giá tính bằng nghìn đồng · Nguồn: Trung tâm phân tích VCBS (vcbs.com.vn)</div></section>`;
  }
  const bc = locBaoCao();
  html += `<section class="dg-the"><h2>Báo cáo mới nhất từ các CTCK (${bc.length})</h2>`;
  html += bc.length ? bc.slice(0, st.hien).map(b => {
    const ngay = b.ngay ? new Date(b.ngay).toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" }) : "";
    const kn = b.kn ? `<span class="kn ${KN_TOT.test(b.kn) ? "tot" : KN_XAU.test(b.kn) ? "xau" : ""}">${esc(b.kn)}</span>` : "";
    const gmt = b.gmt ? `<span class="gmt">GMT ${b.gmt.toLocaleString("vi-VN")}</span>` : "";
    return `<article class="tin" style="--mau:var(--accent)">
      <div class="dong-dau"><span class="gio">${ngay}</span>
        ${b.ma ? `<button class="chip ${UU.has(b.ma) ? "sao" : ""}" data-ma="${esc(b.ma)}">${esc(b.ma)}</button>` : ""}
        ${kn}${gmt}<span class="nguon" title="${esc(b.ctck || "")}">${esc(b.ctck_ngan || "")}</span></div>
      <a class="td" href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.td)}</a>
      ${b.tom_tat ? `<details><summary>Tóm tắt</summary>${esc(b.tom_tat)}</details>` : ""}
    </article>`;
  }).join("") : `<div class="trong">Không có báo cáo phù hợp.</div>`;
  if (bc.length > st.hien) html += `<button class="them" id="xemThem">Xem thêm (${bc.length - st.hien} báo cáo)</button>`;
  html += `<div class="ghi-chu">Nguồn: CafeF tổng hợp báo cáo của các CTCK. Khuyến nghị và giá mục tiêu (GMT) được đọc tự động
    từ tiêu đề, tóm tắt nên có thể thiếu; xem báo cáo gốc để chắc chắn.</div></section>`;
  document.getElementById("dsTin").innerHTML = html;
}

function veTin(ds) {
  if (st.nhom === "dg") {
    veDinhGia();
    const dl = document.getElementById("dangLoc");
    dl.classList.toggle("hien", !!st.ma);
    dl.innerHTML = st.ma ? `Đang lọc mã <b>${esc(st.ma)}</b><button id="boLocMa">✕ Bỏ lọc</button>` : "";
    return;
  }
  const loc = st.nhom === "tat" ? ds : st.nhom === "uu" ? ds.filter(t => t.uu) : ds.filter(t => t.nhom === st.nhom);
  const hien = loc.slice(0, st.hien);
  let html = "", ngayTruoc = "";
  for (const t of hien) {
    const ngay = nhanNgay(t.d);
    if (ngay !== ngayTruoc) { html += `<div class="ngay">${ngay}</div>`; ngayTruoc = ngay; }
    const gio = t.d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    const chips = t.ma.map(m => `<button class="chip ${UU.has(m) ? "sao" : ""}" data-ma="${m}">${m}</button>`).join("");
    html += `<article class="tin ${t.uu ? "uu" : ""}" style="--mau:${MAU[t.nhom]}">
      <div class="dong-dau"><span class="gio">${gio}</span><span class="nhan">${TEN_NGAN[t.nhom]}</span>
        ${t.moi ? '<span class="moi">MỚI</span>' : ""}${chips}
        <span class="nguon">${esc(t.nguon)}${t.dich ? " · dịch máy" : ""}</span></div>
      <a class="td" href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.td)}</a>
      ${t.sapo ? `<div class="sapo">${esc(t.sapo)}</div>` : ""}
    </article>`;
  }
  if (!loc.length) html = `<div class="trong">Không có tin phù hợp. Thử mở rộng khoảng thời gian hoặc xóa bộ lọc.</div>`;
  if (loc.length > st.hien) html += `<button class="them" id="xemThem">Xem thêm (${loc.length - st.hien} tin)</button>`;
  document.getElementById("dsTin").innerHTML = html;

  const dl = document.getElementById("dangLoc");
  dl.classList.toggle("hien", !!st.ma);
  dl.innerHTML = st.ma ? `Đang lọc mã <b>${esc(st.ma)}</b><button id="boLocMa">✕ Bỏ lọc</button>` : "";
}

function ve() {
  const ds = locTheoGioVaTim();
  veTabs(ds); veMaNong(ds); veTin(ds); ghiHash();
}

const GIA = DATA.gia || {};
let nhomGia = luuDoc("tt_nhom_gia", "hh");
function soDep(x, theoGia = x) {
  const le = Math.abs(theoGia) >= 10 ? 2 : 4;
  return x.toLocaleString("vi-VN", { minimumFractionDigits: le, maximumFractionDigits: le });
}
function veGia() {
  if (!GIA[nhomGia]) nhomGia = Object.keys(GIA)[0];
  if (!nhomGia) { document.getElementById("bangGia").innerHTML = "<tr><td>Chưa có dữ liệu giá</td></tr>"; return; }
  document.getElementById("tabGia").innerHTML = Object.entries(GIA).map(([k, n]) =>
    `<button class="${k === nhomGia ? "chon" : ""}" data-gia="${k}">${esc(n.ten)}</button>`).join("");
  document.getElementById("bangGia").innerHTML = GIA[nhomGia].ds.map(g => {
    const lop = g.doi > 0 ? "tang" : g.doi < 0 ? "giam" : "";
    const mui = g.doi > 0 ? "▲" : g.doi < 0 ? "▼" : "";
    return `<tr><td>${esc(g.ten)}<span class="dv">${esc(g.dv)}</span></td>
      <td class="so">${soDep(g.gia)}</td>
      <td class="so bo-doi ${lop}">${mui} ${soDep(Math.abs(g.doi), g.gia)}</td>
      <td class="so ${lop}">${g.pt > 0 ? "+" : ""}${g.pt.toLocaleString("vi-VN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%</td></tr>`;
  }).join("");
}
document.getElementById("tabGia").addEventListener("click", e => {
  const b = e.target.closest("button[data-gia]");
  if (b) { nhomGia = b.dataset.gia; luuGhi("tt_nhom_gia", nhomGia); veGia(); }
});
veGia();

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { st.nhom = tab.dataset.nhom; st.hien = TRANG; ve(); return; }
  const chip = e.target.closest(".chip");
  if (chip) { st.ma = st.ma === chip.dataset.ma ? "" : chip.dataset.ma; st.hien = TRANG; ve(); scrollTo({ top: 0 }); return; }
  const vc = e.target.closest("button[data-vcbs]");
  if (vc) { dmVcbs = vc.dataset.vcbs; luuGhi("tt_vcbs", dmVcbs); ve(); return; }
  if (e.target.id === "boLocMa") { st.ma = ""; ve(); return; }
  if (e.target.id === "xemThem") { st.hien += TRANG; ve(); }
});
const oTim = document.getElementById("timKiem");
oTim.value = st.q;
oTim.addEventListener("input", () => { st.q = oTim.value; st.hien = TRANG; ve(); });
const chonGio = document.getElementById("khoangGio");
chonGio.value = String(st.gio);
chonGio.addEventListener("change", () => { st.gio = +chonGio.value; ve(); });

capNhatDongHo();
setInterval(capNhatDongHo, 60e3);
ve();
// Tự tải lại để lấy dữ liệu mới (chương trình ghi lại file mỗi 10 phút); không tải lại khi đang gõ tìm kiếm
// Thêm ?t=... để trình duyệt không dùng bản lưu tạm (GitHub Pages cho giữ tạm 10 phút)
setInterval(() => {
  if (document.activeElement !== oTim) location.replace(location.pathname + "?t=" + Date.now() + location.hash);
}, 5 * 60e3);
</script>
